[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-conformal"
version = "0.4.0"
description = "Distribution-free prediction intervals for insurance GBM and GLM pricing models"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Burning Cost", email = "pricing.frontier@gmail.com" },
]
keywords = [
    "conformal prediction",
    "insurance",
    "prediction intervals",
    "tweedie",
    "gbm",
    "glm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "polars>=0.20",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]
plot = ["matplotlib>=3.6"]
all = ["catboost>=1.2", "matplotlib>=3.6"]
dev = [
    "pytest>=7.0",
    "pyarrow>=12.0",
    "pytest-cov>=4.0",
    "catboost>=1.2",
    "matplotlib>=3.6",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/burning-cost/insurance-conformal"
Repository = "https://github.com/burning-cost/insurance-conformal"
Issues = "https://github.com/burning-cost/insurance-conformal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_conformal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[dependency-groups]
dev = [
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
]

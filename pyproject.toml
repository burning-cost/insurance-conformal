[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-conformal"
version = "1.3.0"
description = "Distribution-free prediction intervals for insurance pricing models: conformal coverage guarantees, Tweedie non-conformity scores, SCR bounds, and anytime-valid sequential monitoring"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Burning Cost", email = "pricing.frontier@gmail.com" },
]
keywords = [
    "conformal prediction",
    "insurance",
    "prediction intervals",
    "tweedie",
    "gbm",
    "glm",
    "UK",
    "personal lines",
    "actuarial",
    "pricing",
    "SCR",
    "solvency",
    "conformal risk control",
    "coverage guarantee",
    "sequential",
    "distribution-free",
    "survival analysis",
    "censored data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pandas>=2.0",
    "scipy>=1.12",
    "pyarrow>=14.0",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]
lightgbm = ["lightgbm>=4.0"]
plot = ["matplotlib>=3.6", "pillow>=12.1.1"]
survival = ["lifelines>=0.27", "scikit-survival>=0.22"]
all = ["catboost>=1.2", "lightgbm>=4.0", "matplotlib>=3.6", "pillow>=12.1.1", "lifelines>=0.27", "scikit-survival>=0.22"]
dev = [
    "pytest>=8.4",
    "pyarrow>=21.0",
    "pytest-cov>=4.0",
    "catboost>=1.2",
    "lightgbm>=4.0",
    "matplotlib>=3.6",
    "scikit-learn>=1.6",
    # Security floor constraint (transitive via matplotlib)
    "pillow>=12.1.1",
    "pdoc>=14.0.0",
]

[project.urls]
Homepage = "https://burning-cost.github.io/"
Repository = "https://github.com/burning-cost/insurance-conformal"
Changelog = "https://github.com/burning-cost/insurance-conformal/releases"
Documentation = "https://burning-cost.github.io/insurance-conformal"
"Bug Tracker" = "https://github.com/burning-cost/insurance-conformal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_conformal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[dependency-groups]
dev = [
    "lightgbm>=4.6.0",
    "pytest-cov>=7.0.0",
]
